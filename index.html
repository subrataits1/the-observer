<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Observer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Custom Cursor -->
    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <!-- Loading Screen -->
    <div id="loader" class="loader">
        <span class="loader-text">Breathe in.</span>
    </div>

    <!-- Floating Navigation -->
    <nav class="floating-nav" id="navbar">
        <a href="index.html" class="nav-brand">The Observer</a>
        <div class="nav-links">
            <a href="#about" class="hover-target">About</a>
            <a href="#photography" class="hover-target">Photography</a>
            <a href="#travel" class="hover-target">Travel Diary</a>
            <a href="#thoughts" class="hover-target">Thoughts</a>
        </div>
        <button class="nav-toggle hover-target" aria-label="Menu">
            <span></span>
            <span></span>
        </button>
    </nav>

    <!-- Main Content -->
    <main id="main-content">
        <section class="hero" id="hero">
            <canvas id="particles-canvas"></canvas>
            <div class="hero-content">
                <h1 class="reveal-text" id="hero-greeting"></h1>
                <p class="reveal-text delay-1" id="hero-subtitle"></p>
            </div>
            <div class="scroll-indicator reveal-text delay-2">
                <span>Discover</span>
                <div class="line"></div>
            </div>
        </section>

        <!-- Spacer for scroll testing in Phase 1 -->
        <section class="spacer">
            <div class="bento-container" id="bento-preview">
                <!-- Will be populated in future phases, keeping structure ready -->
            </div>
        </section>
    </main>

    <script type="module" src="js/main.js"></script>
</body>
</html>
